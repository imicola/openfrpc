[package]
name = "frpdeck"
version = "0.1.0"
description = "OpenFrpc — frpc 桌面管理客户端"
authors = ["imicola"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "frpdeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
toml_edit = "0.22"
chrono = "0.4"
netstat2 = "0.11"
sysinfo = "0.33"
rand = "0.8"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
